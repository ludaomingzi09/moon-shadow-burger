<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>店主日誌 - 月の影ハンバーガー</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HPYLHB9YT4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-HPYLHB9YT4');
  </script>
  
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; background-color: #fff8f0; }
    .diary-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; background-color: #fff; max-height: 300px; overflow-y: auto; }

  </style>
</head>
<body>

  <h1>📖 店主日誌</h1>
  <p>月の影ハンバーガー店主の日常・開店記録です。</p>
  <hr>

  <div id="diary-list">読み込み中...</div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzO8d8v49ZJw1ms7v7nOKGjuVSXM5_k9COs_AGcYgLKEh_zUddDNU98n68daqHBbpE5eA/exec";
    // ※発行されたGASのURLがある場合はここに指定
    const diaryList = document.querySelector("#diary-list");

    async function loadPublicDiaries() {
      try {
        const res = await fetch(GAS_URL);
        const diaries = await res.json();

        // ヘッダー行や無効データを除外フィルタリング
        const validDiaries = diaries.filter(d => d.date && d.date !== "date" && d.content !== "content");

        if (!validDiaries || validDiaries.length === 0) {
          diaryList.innerHTML = "<p>投稿された日誌はありません。</p>";
          return;
        }

        diaryList.innerHTML = "";
        validDiaries.forEach(diary => {
          const card = document.createElement("div");
          card.className = "diary-card";
          card.innerHTML = `<h3>📅 ${diary.date}</h3><p>💰 本日の売上: ${diary.sales || 0} 月幣</p><hr><p>${(diary.content || "").replace(/\n/g, "<br>")}</p>`;
          diaryList.appendChild(card);
        });
      } catch (e) {
        diaryList.innerHTML = "<p>通信エラーが発生しました。</p>";
      }
    }

    loadPublicDiaries();
  </script>
</body>
</html>
