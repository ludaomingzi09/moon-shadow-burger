<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>【管理用】日誌投稿画面 - 月の影ハンバーガー</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; background-color: #fff8f0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="date"], input[type="number"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    textarea { height: 100px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    .diary-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; background-color: #fff; }
  </style>
</head>
<body>

  <h1>🔒 店主専用 日誌管理・投稿画面</h1>
  <p>※このページはあきこさん専用です。</p>
  <hr>

  <h2>📝 新しい日誌を書く</h2>
  <div class="form-group">
    <label>日付：</label>
    <input type="date" id="diary-date">
  </div>
  <div class="form-group">
    <label>本日の売上（月幣）：</label>
    <input type="number" id="diary-sales" placeholder="例: 12000">
  </div>
  <div class="form-group">
    <label>メモ・出来事：</label>
    <div style="margin-bottom: 5px;">
      <button type="button" id="btn-bold"><b>太字</b></button>
      <button type="button" id="btn-red" style="color:red;">赤字</button>
      <button type="button" id="btn-orange" style="color:orange;">オレンジ字</button>
      <button type="button" id="btn-big">大文字</button>
    </div>
    <textarea id="diary-content" placeholder="今日の出来事を書きましょう！"></textarea>
  </div>

  <button id="save-diary-btn" style="background-color: #4CAF50; color: white; border: none; border-radius: 5px;">💾 保存して投稿する</button>

  <hr>
  <h2>📂 現在公開中の日誌一覧</h2>
  <div id="diary-list">読み込み中...</div>

  <script>
    // LocalStorageからBin IDを取得。なければ新規作成用の設定
    let BIN_ID = localStorage.getItem("my_new_bin_id") || "6a8a43f5da38895dfe05659b";
    const MASTER_KEY = "$2a$10$EYKFCyKFt/nebBJYYq0uZ.44OqKYIZsj4EN5eevpnx.ivD8B3Dlmq";

    const dateInput = document.querySelector("#diary-date");
    const salesInput = document.querySelector("#diary-sales");
    const contentInput = document.querySelector("#diary-content");
    const saveBtn = document.querySelector("#save-diary-btn");
    const diaryList = document.querySelector("#diary-list");

    // 装飾ボタン
    function insertTag(startTag, endTag) {
      const start = contentInput.selectionStart;
      const end = contentInput.selectionEnd;
      const text = contentInput.value;
      const selectedText = text.substring(start, end);
      contentInput.value = text.substring(0, start) + startTag + selectedText + endTag + text.substring(end);
      contentInput.focus();
    }
    document.querySelector("#btn-bold").onclick = () => insertTag("<b>", "</b>");
    document.querySelector("#btn-red").onclick = () => insertTag("<span style='color:red;'>", "</span>");
    document.querySelector("#btn-orange").onclick = () => insertTag("<span style='color:orange;'>", "</span>");
    document.querySelector("#btn-big").onclick = () => insertTag("<span style='font-size:1.2em; font-weight:bold;'>", "</span>");

    // 新規Bin作成関数
    async function createNewBin(initialData) {
      const res = await fetch("https://api.jsonbin.io/v3/b", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": MASTER_KEY,
          "X-Bin-Private": "false"
        },
        body: JSON.stringify({ diaries: initialData })
      });
      if (res.ok) {
        const data = await res.json();
        BIN_ID = data.metadata.id;
        localStorage.setItem("my_new_bin_id", BIN_ID);
        alert("新しい専用データ倉庫を作成しました！\n新しいBin ID: " + BIN_ID + "\n（※このIDをメモして教えていただければdiary.html側も繋ぎ直せます！）");
        return true;
      } else {
        alert("新しい倉庫の作成に失敗しました。マスターキー自体が無効な可能性があります。");
        return false;
      }
    }

    // データ取得
    async function getDiaries() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": MASTER_KEY },
          cache: "no-cache"
        });
        if (res.status === 403 || res.status === 404) {
          // 403エラーなら新規作成を促す
          return "NEED_CREATE";
        }
        if (!res.ok) return null;
        const data = await res.json();
        return data.record.diaries || [];
      } catch (e) {
        return null;
      }
    }

    // 保存処理
    async function saveDiaries(diaries) {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
          body: JSON.stringify({ diaries: diaries })
        });
        if (res.status === 403) {
          // 403の場合は新しい倉庫を作成して保存
          return await createNewBin(diaries);
        }
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    // 一覧表示
    async function displayDiaries() {
      diaryList.innerHTML = "読み込み中...";
      const diaries = await getDiaries();
      if (diaries === "NEED_CREATE") {
        diaryList.innerHTML = "<p style='color:orange;'>⚠️ 現在の鍵で新しい倉庫を自動作成します。上のフォームから最初の投稿を試してください！</p>";
        return;
      }
      if (!diaries) {
        diaryList.innerHTML = "<p style='color:red;'>読み込みエラーが発生しました。</p>";
        return;
      }
      diaryList.innerHTML = diaries.length === 0 ? "<p>投稿された日誌はありません。</p>" : "";
      diaries.forEach((diary, index) => {
        const card = document.createElement("div");
        card.className = "diary-card";
        card.innerHTML = `<h4>📅 ${diary.date} （売上: ${diary.sales} 月幣）</h4><p>${diary.content.replace(/\n/g, "<br>")}</p>`;
        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑️ 削除";
        delBtn.style.cssText = "background:#ff4d4d; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;";
        delBtn.onclick = async () => {
          if (confirm("本当に削除しますか？")) {
            const currentList = await getDiaries();
            if (Array.isArray(currentList)) {
              currentList.splice(index, 1);
              await saveDiaries(currentList);
              displayDiaries();
            }
          }
        };
        card.appendChild(delBtn);
        diaryList.appendChild(card);
      });
    }

    // 保存ボタン
    saveBtn.onclick = async () => {
      if (!dateInput.value || !contentInput.value) { alert("日付と本文を入力してください！"); return; }
      saveBtn.textContent = "送信中..."; saveBtn.disabled = true;
      
      let currentList = await getDiaries();
      if (currentList === "NEED_CREATE" || !Array.isArray(currentList)) {
        currentList = [];
      }

      currentList.unshift({ date: dateInput.value, sales: salesInput.value || 0, content: contentInput.value });
      
      const success = await saveDiaries(currentList);
      if (success) {
        dateInput.value = ""; salesInput.value = ""; contentInput.value = "";
        alert("安全に保存されました！");
        await displayDiaries();
      } else {
        alert("保存に失敗しました。");
      }
      saveBtn.textContent = "💾 保存して投稿する"; saveBtn.disabled = false;
    };

    displayDiaries();
  </script>
</body>
</html>
